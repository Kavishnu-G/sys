<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under construction – Your Brand</title>
<meta name="description" content="Our new website is being built. We'll be open soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme: Modern Tech Retail / Clean Enterprise Blue */
:root{
  --navy:#0F1B3D;
  --slate:#0F172A;
  --accent:#1D4ED8;
  --accent-hover:#1841B0;
  --cta:#2563EB;
  --white:#FFFFFF;
  --bg-soft:#F6F8FB;
  --panel-bg:#EEF1FB;
  --line:#E5E9F0;
  --ink:#1E293B;
  --ink-soft:#64748B;
  --green:#16A34A;
  --amber:#F59E0B;
  --red:#DC2626;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;background:var(--bg-soft);color:var(--ink);font:400 1rem/1.6 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.wrap{max-width:68rem;margin:0 auto;padding:1.5rem 1.5rem 3rem}

h1{font:700 clamp(2.6rem,9vw,6rem)/1.02 var(--font);letter-spacing:-.03em;color:var(--navy);margin:3.5rem 0 1.25rem;max-width:13ch}
.lede{max-width:34rem;font-size:1.15rem;color:var(--ink-soft)}

/* Hazard tape (amber + navy) */
.tape{position:relative;left:50%;width:120vw;margin:3.5rem 0 3.5rem -60vw;transform:rotate(-2.2deg);
  background:repeating-linear-gradient(-45deg,var(--amber) 0 28px,var(--navy) 28px 56px);padding:10px 0;box-shadow:0 8px 20px rgba(15,27,61,.2)}
.tape .track{background:var(--amber);color:var(--navy);overflow:hidden;white-space:nowrap;border-block:3px solid var(--navy)}
.tape .inner{display:inline-block;padding:.4rem 0;font:700 1.5rem/1.2 var(--font);letter-spacing:.14em;animation:slide 24s linear infinite}
.tape .inner span{padding:0 1.6rem}
@keyframes slide{to{transform:translateX(-50%)}}


@media (max-width:760px){.tape .inner{font-size:1.15rem}h1{margin-top:2.5rem}}
@media (prefers-reduced-motion:reduce){.tape .inner{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <main>
    <h1>We're building something new.</h1>
    <p class="lede">Our new website isn't ready yet. We're putting the last pieces in place and will open the doors soon.</p>

    <div class="tape" aria-hidden="true">
      <div class="track"><div class="inner" id="tape"></div></div>
    </div>
  </main>
</div>

<script>
/* ---- Edit these ---- */
var TAPE_TEXT = 'UNDER CONSTRUCTION';           // text on the tape
/* -------------------- */

// Tape text (repeated so the loop is seamless)
var unit = '<span>' + TAPE_TEXT + '</span><span>&#9888;</span>';
document.getElementById('tape').innerHTML = unit.repeat(16);

</script>
</body>
</html>
